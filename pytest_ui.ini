[pytest]
; ============================================================
;  UI 自动化测试专用配置（Playwright + Allure）
;  运行：  python -m pytest -c pytest_ui.ini
; ============================================================

testpaths = ui_tests

pythonpath =
    .

addopts =
    -v
    -ra
    --browser chromium
    --screenshot only-on-failure
    --tracing retain-on-failure
    --output ui_tests/artifacts
    --alluredir ui_tests/allure-results
    --clean-alluredir

markers =
    ui: UI 自动化测试用例
